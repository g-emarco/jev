[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jev_demo*"]

[project]
name = "jev-demo"
version = "0.1.0"
description = "Slide deck and runnable examples for TypeSafe's Jev decision model with LangChain and Google"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.15",
    "langchain-typesafe[experimental]>=0.0.1a3",
    "langchain-google-genai",
    "langchain-openai",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
